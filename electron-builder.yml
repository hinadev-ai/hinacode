appId: app.hinacode
productName: HinaCode
directories:
  output: dist
# node-pty ships N-API prebuilds for every platform. N-API binaries load in Electron as they are, and rebuilding
# cannot cross-compile node-pty for Windows on Linux.
npmRebuild: false
# node-pty spawns a native binary, which cannot run from inside app.asar.
asarUnpack:
  - "**/node_modules/node-pty/**"
# Each platform lists its whole file set, with no top-level `files`. electron-builder keeps a top-level list
# apart from a platform one, and a platform list of only exclusions then packages the entire repo.
# Claude threads run the user's own `claude`, which updates faster than hinacode ships, so the SDK's binary is left out.
# Packages' TypeScript sources and source maps never run.
mac:
  files:
    - out/**
    - package.json
    - "!out/server/**"
    - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
    - "!**/node_modules/**/*.{ts,map}"
    - "!**/node_modules/node-pty/prebuilds/{win32,linux,darwin-x64}*/**"
    - "!**/node_modules/electron-liquid-glass/{js,src,prebuilds/darwin-x64}/**"
  target:
    - target: dmg
      arch: arm64
    # Squirrel.Mac installs updates from the zip.
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: assets/icon.png
  hardenedRuntime: true
  notarize: true
# The background's size sets the window size. electron-builder picks up dmg-background@2x.png for Retina.
# Redraw both PNGs from the SVG with rsvg-convert at 540x380 and 1080x760. Both icons sit inside its track.
dmg:
  background: assets/dmg-background.png
  iconSize: 96
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
win:
  files:
    - out/**
    - package.json
    - "!out/server/**"
    - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
    - "!**/node_modules/**/*.{ts,map}"
    - "!**/node_modules/node-pty/prebuilds/{darwin,linux,win32-arm64}*/**"
    - "!**/node_modules/node-pty/build/**"
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.png
nsis:
  # GitHub renames assets with spaces, which would break the URL in latest.yml.
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  files:
    - out/**
    - package.json
    - "!out/server/**"
    - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
    - "!**/node_modules/**/*.{ts,map}"
    - "!**/node_modules/node-pty/prebuilds/{darwin,win32,linux-arm64}*/**"
  target:
    - target: AppImage
      arch: x64
  category: Development
  icon: assets/icon.png
publish:
  provider: github
  owner: hinadev-ai
  repo: hinacode
  releaseType: release
