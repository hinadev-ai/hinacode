name: Install dependencies
description: Run pnpm install with the Electron download cached, and retry it when GitHub releases time out.

runs:
  using: composite
  steps:
    - id: electron
      shell: bash
      working-directory: ${{ github.workspace }}
      run: echo "version=$(node -p 'require("./package.json").devDependencies.electron')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/electron
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        export electron_config_cache="$HOME/.cache/electron"
        for attempt in 1 2 3 4; do
          pnpm install --frozen-lockfile && exit 0
          echo "::warning::pnpm install failed on attempt $attempt"
          sleep $((attempt * 15))
        done
        exit 1
