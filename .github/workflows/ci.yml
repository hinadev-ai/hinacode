name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      desktop: ${{ steps.app.outputs.desktop }}
      site: ${{ steps.site.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: app
        with:
          predicate-quantifier: every
          filters: |
            app: &app
              - '**'
              - '!*.md'
              - '!**/README.md'
              - '!**/AGENTS.md'
              - '!LICENSE'
              - '!docs/**'
              - '!specs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!site/**'
            desktop:
              - *app
              - '!apps/mobile/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: site
        with:
          filters: |
            site:
              - 'site/**'
              - 'messages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - if: needs.changes.outputs.app == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site check
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site deploy:dry-run
      - if: needs.changes.outputs.app == 'true'
        name: Install search test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - if: needs.changes.outputs.app == 'true'
        run: pnpm test

  e2e-linux:
    name: e2e (linux)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Without a window manager, minimizing a window does nothing. Search runs ripgrep.
      - run: sudo apt-get update && sudo apt-get install --yes xvfb openbox ripgrep
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm test:e2e'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-linux
          path: |
            e2e/playwright-report
            e2e/test-results

  e2e-macos:
    name: e2e (macos)
    needs: changes
    # The home runner must never run code from a fork's pull request.
    if: needs.changes.outputs.desktop == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, home]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the screen is unlocked
        run: |
          if ioreg -n Root -d1 | grep -q '"CGSSessionScreenIsLocked"=Yes'; then
            echo "::error::Unlock the runner's screen. Electron never reports a window as shown while it is locked."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-macos
          path: |
            e2e/playwright-report
            e2e/test-results
