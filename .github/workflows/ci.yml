name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      desktop: ${{ steps.app.outputs.desktop }}
      site: ${{ steps.site.outputs.site }}
      relay: ${{ steps.relay.outputs.relay }}
      resource-monitor: ${{ steps.resource-monitor.outputs.resource-monitor }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: app
        with:
          predicate-quantifier: every
          filters: |
            app: &app
              - '**'
              - '!*.md'
              - '!**/README.md'
              - '!**/AGENTS.md'
              - '!LICENSE'
              - '!docs/**'
              - '!specs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!site/**'
              - '!relay/**'
            desktop:
              - *app
              - '!apps/mobile/**'
              - '!tools/**'
              - '!scripts/**'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!.github/workflows/build.yml'
              - '!.github/workflows/react-doctor.yml'
              - '!.oxlintrc.json'
              - '!.oxfmtrc.json'
              - '!skills-lock.json'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: site
        with:
          filters: |
            site:
              - 'site/**'
              - 'messages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: relay
        with:
          filters: |
            relay:
              - 'relay/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: resource-monitor
        with:
          filters: |
            resource-monitor:
              - 'tools/resource-monitor/**'
              - '.github/workflows/ci.yml'

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - if: needs.changes.outputs.app == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site check
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site deploy:dry-run
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay check
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay test
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay deploy:dry-run
      - if: needs.changes.outputs.app == 'true'
        name: Install search test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - if: needs.changes.outputs.app == 'true'
        name: Install and select the pinned Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "HINACODE_BROWSER_EXECUTABLE_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.app == 'true'
        name: Allow Chromium sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: needs.changes.outputs.app == 'true'
        run: pnpm test

  mobile:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml
      # tsc resolves effect types for src/shared from the root, so the root install is needed too.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npx expo lint

  bundle-size:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Sibling checkouts, because Tailwind scans every file under the project for class names.
      - uses: actions/checkout@v7
        with:
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: head/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml
      # The base builds with this pull request's commands and budgets, so both sides measure the same files.
      - name: Build both commits
        run: |
          for dir in base head; do
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm build && pnpm exec electron-builder --linux AppImage --publish never)
          done
      - name: Measure
        working-directory: head
        # size-limit exits 1 over budget. The last step fails the job after the comment is posted.
        run: |
          cp .size-limit.ts ../base/
          pnpm exec size-limit --json --config ../base/.size-limit.ts > ../base.json || true
          pnpm exec size-limit --json > ../head.json || true
          node scripts/bundle-size.ts ../base.json ../head.json | tee ../comment.md >> "$GITHUB_STEP_SUMMARY"
      # A fork's pull request gets a read-only token, so it only has the job summary.
      # The marker finds this job's own comment, since React Doctor posts as the same bot.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        name: Post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- bundle-size -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi
      - name: Check the budgets
        working-directory: head
        run: pnpm exec size-limit

  e2e-linux:
    name: e2e (linux ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Without a window manager, minimizing a window does nothing. Search runs ripgrep.
      - run: sudo apt-get update && sudo apt-get install --yes xvfb openbox ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec bddgen -c e2e/playwright.config.ts
      # A shard runs every test of the projects its tests depend on, so desktop runs as its own pass instead.
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm exec playwright test -c e2e/playwright.config.ts --project parallel --shard ${{ matrix.shard }}/4'
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm exec playwright test -c e2e/playwright.config.ts --project desktop --no-deps --shard ${{ matrix.shard }}/4'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-linux-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results

  e2e-macos:
    name: e2e (macos)
    needs: changes
    # The home runner must never run code from a fork's pull request.
    if: needs.changes.outputs.desktop == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, home]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the screen is unlocked
        run: |
          if ioreg -n Root -d1 | grep -q '"CGSSessionScreenIsLocked"=Yes'; then
            echo "::error::Unlock the runner's screen. Electron never reports a window as shown while it is locked."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-macos
          path: |
            e2e/playwright-report
            e2e/test-results

  resource-monitor-linux:
    name: resource monitor (linux)
    needs: changes
    if: needs.changes.outputs.resource-monitor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/resource-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/resource-monitor/go.mod
          cache-dependency-path: tools/resource-monitor/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .

  resource-monitor-macos:
    name: resource monitor (macos)
    needs: changes
    # The home runner must never run code from a fork's pull request.
    if: needs.changes.outputs.resource-monitor == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, home]
    defaults:
      run:
        working-directory: tools/resource-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/resource-monitor/go.mod
          cache-dependency-path: tools/resource-monitor/go.sum
      - run: CGO_ENABLED=0 go test ./...
