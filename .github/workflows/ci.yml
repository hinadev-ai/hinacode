name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - run: pnpm typecheck
      - run: pnpm --dir site check
      - run: pnpm --dir site deploy:dry-run
      - name: Install search test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: pnpm test

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, Linux, X64, home, proxmox]
            # The runner has xvfb-run and openbox installed. Without a window manager, minimizing a window does nothing.
            command: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm test:e2e'
          - os: macos
            runner: [self-hosted, macOS, ARM64, home]
            command: pnpm test:e2e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os == 'macOS'
        name: Check the screen is unlocked
        run: |
          if ioreg -n Root -d1 | grep -q '"CGSSessionScreenIsLocked"=Yes'; then
            echo "::error::Unlock the runner's screen. Electron never reports a window as shown while it is locked."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e/playwright-report
            e2e/test-results
