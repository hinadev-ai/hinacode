name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
      desktop: ${{ steps.app.outputs.desktop }}
      site: ${{ steps.site.outputs.site }}
      relay: ${{ steps.relay.outputs.relay }}
      resource-monitor: ${{ steps.resource-monitor.outputs.resource-monitor }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: app
        with:
          predicate-quantifier: every
          filters: |
            app: &app
              - '**'
              - '!*.md'
              - '!**/README.md'
              - '!**/AGENTS.md'
              - '!LICENSE'
              - '!docs/**'
              - '!specs/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!site/**'
              - '!relay/**'
            desktop:
              - *app
              - '!apps/mobile/**'
              - '!tools/**'
              - '!scripts/**'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!.github/workflows/build.yml'
              - '!.github/workflows/react-doctor.yml'
              - '!.oxlintrc.json'
              - '!.oxfmtrc.json'
              - '!skills-lock.json'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: site
        with:
          filters: |
            site:
              - 'site/**'
              - 'messages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: relay
        with:
          filters: |
            relay:
              - 'relay/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: resource-monitor
        with:
          filters: |
            resource-monitor:
              - 'tools/resource-monitor/**'
              - '.github/workflows/ci.yml'

  static:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - if: needs.changes.outputs.app == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site check
      - if: needs.changes.outputs.site == 'true'
        run: pnpm --dir site deploy:dry-run
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay check
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay test
      - if: needs.changes.outputs.relay == 'true'
        run: pnpm --dir relay deploy:dry-run
      - if: needs.changes.outputs.app == 'true'
        name: Verify the server package
        run: |
          node --test scripts/server-package.test.ts
          pnpm build:server
          pnpm stage:server
          pnpm verify:server

  web-build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web deploy:dry-run

  test:
    name: test (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # FIXME: GitHub's release downloads time out with a 504 now and then, and the Electron binary comes from there
      - run: for attempt in 1 2 3 4 5; do pnpm exec install-electron && exit 0; sleep $((attempt * 15)); done; exit 1
      - name: Install search test dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install and select the pinned Chromium
        run: |
          pnpm exec playwright install chromium
          echo "HINACODE_BROWSER_EXECUTABLE_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Allow Chromium sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test --shard ${{ matrix.shard }}/3

  # The main ruleset requires a check named "check", so this job reports the result of the jobs it replaced.
  check:
    needs: [changes, static, web-build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  executable:
    name: executable and mobile
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:exe
      - run: pnpm verify:exe
      # tsc resolves effect types for src/shared from the root, so the root install is needed too.
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - run: npx tsc --noEmit
        working-directory: apps/mobile

  e2e-linux:
    name: e2e (linux ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Without a window manager, minimizing a window does nothing. Search runs ripgrep.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb openbox ripgrep
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # FIXME: GitHub's release downloads time out with a 504 now and then, and the Electron binary comes from there
      - run: for attempt in 1 2 3 4 5; do pnpm exec install-electron && exit 0; sleep $((attempt * 15)); done; exit 1
      - run: pnpm exec bddgen -c e2e/playwright.config.ts
      # A shard runs every test of the projects its tests depend on, so desktop runs as its own pass instead.
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm exec playwright test -c e2e/playwright.config.ts --project parallel --workers 3 --shard ${{ matrix.shard }}/6'
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm exec playwright test -c e2e/playwright.config.ts --project desktop --no-deps --shard ${{ matrix.shard }}/6'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-linux-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results

  e2e-web:
    name: e2e (web)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e:web --workers 4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-web
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results

  resource-monitor-linux:
    name: resource monitor (linux)
    needs: changes
    if: needs.changes.outputs.resource-monitor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/resource-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/resource-monitor/go.mod
          cache-dependency-path: tools/resource-monitor/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .

  resource-monitor-macos:
    name: resource monitor (macos)
    needs: changes
    # Fork pull requests skip macOS, where a minute costs twenty Linux ones.
    if: needs.changes.outputs.resource-monitor == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-6vcpu-macos-latest
    defaults:
      run:
        working-directory: tools/resource-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/resource-monitor/go.mod
          cache-dependency-path: tools/resource-monitor/go.sum
      - run: CGO_ENABLED=0 go test ./...
