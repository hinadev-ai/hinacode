name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format --check
      - run: pnpm typecheck
      - run: pnpm --dir site check
      - run: pnpm --dir site deploy:dry-run
      - name: Install search test dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: pnpm test

  e2e-linux:
    name: e2e (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Without a window manager, minimizing a window does nothing.
      - run: sudo apt-get update && sudo apt-get install --yes xvfb openbox
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a sh -c 'openbox 2>/dev/null & pnpm test:e2e'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-linux
          path: |
            e2e/playwright-report
            e2e/test-results

  e2e-macos:
    name: e2e (macos)
    # The home runner must never run code from a fork's pull request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, home]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the screen is unlocked
        run: |
          if ioreg -n Root -d1 | grep -q '"CGSSessionScreenIsLocked"=Yes'; then
            echo "::error::Unlock the runner's screen. Electron never reports a window as shown while it is locked."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-macos
          path: |
            e2e/playwright-report
            e2e/test-results
