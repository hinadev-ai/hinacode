name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# A tag publishes its release into this repository, so the workflow token is enough.
# The tag is the version: each build job writes it into package.json before packaging.
permissions:
  contents: write

jobs:
  # The build jobs upload into this draft, so a release never goes through Actions artifact storage.
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The release notes list the pull requests merged since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          gh release view "$GITHUB_REF_NAME" && exit
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^")
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --notes-start-tag "$previous"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    needs: draft
    # Pull requests skip the draft job, and a skipped need would skip this job too.
    # The home runner must never run code from a fork's pull request.
    if: ${{ !cancelled() && needs.draft.result != 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, home]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - if: github.ref_type == 'tag'
        name: Write the notarization key
        run: echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - if: github.ref_type == 'tag'
        run: npm pkg set version="${GITHUB_REF_NAME#v}" && pnpm build && pnpm exec electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: github.ref_type != 'tag'
        run: pnpm dist --mac -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  linux-and-windows:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-latest
    # NSIS needs Wine to build the Windows installer on Linux.
    container: electronuserland/builder:24-wine
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - if: github.ref_type == 'tag'
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm build && pnpm exec electron-builder --linux --win --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || '' }}
          # Actions mounts HOME at /github/home, which Wine refuses because root does not own it.
          WINEPREFIX: /root/.wine

  release:
    if: github.ref_type == 'tag'
    needs: [mac, linux-and-windows]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
