name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: [self-hosted, macOS, ARM64, home]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - if: github.ref_type == 'tag'
        name: Write the notarization key
        run: echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - if: github.ref_type == 'tag'
        run: pnpm dist --mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: github.ref_type != 'tag'
        run: pnpm dist --mac -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Only the release job reads these, so PR builds check packaging without storing installers.
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  linux-and-windows:
    runs-on: ubuntu-latest
    # NSIS needs Wine to build the Windows installer on Linux.
    container: electronuserland/builder:24-wine
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist --linux --win
        env:
          # Actions mounts HOME at /github/home, which Wine refuses because root does not own it.
          WINEPREFIX: /root/.wine
      # Only the release job reads these, so PR builds check packaging without storing installers.
      - if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: linux-and-windows
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml

  release:
    if: github.ref_type == 'tag'
    needs: [mac, linux-and-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo kjj6198/kkcode-releases --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
