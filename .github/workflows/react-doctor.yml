name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/react-doctor.yml
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/react-doctor.yml

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2
