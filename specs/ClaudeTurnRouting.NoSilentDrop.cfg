\* expect: Invariant NoSilentDrop is violated
\* A CLI that does not report its state ends the turn at its result, so Claude's reply to a background
\* sub-agent finds no turn.
SPECIFICATION Spec
CONSTANTS
  CliBatchesSteers = TRUE
  CliReportsState = FALSE
  MaxSends = 2
  MaxSteers = 1
  MaxInterrupts = 0
  MaxAbandons = 0
  MaxContent = 1
  MaxBackground = 1
INVARIANT NoSilentDrop
CHECK_DEADLOCK FALSE
