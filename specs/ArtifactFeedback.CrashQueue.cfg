\* expect: Invariant NoSilentLoss is violated
\* Quitting after a turn's finish takes the next message from thread.queue and before startQueued writes it into the
\* transcript loses it (#870). The comment is already marked delivered, because AgentRunner holds it from here.
CONSTANTS
  Comments = {c1, c2}
  Steers = TRUE
  MaxTurns = 3
  MaxStops = 0
  MaxArchives = 0
  MaxAsks = 0
  MaxCrashes = 1
SPECIFICATION Spec
INVARIANTS NoSilentLoss
CHECK_DEADLOCK FALSE
