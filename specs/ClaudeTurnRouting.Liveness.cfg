\* Steers waiting on a turn that opens, ends, is stopped or fails to start. No content messages, so the liveness
\* graph fits a 2 GB heap; ClaudeTurnRouting.cfg checks the invariants with them.
SPECIFICATION Spec
CONSTANTS
  CliBatchesSteers = TRUE
  CliReportsState = TRUE
  MaxSends = 2
  MaxSteers = 2
  MaxInterrupts = 1
  MaxAbandons = 1
  MaxContent = 0
  MaxBackground = 0
INVARIANTS TypeOK SteerStartsOnlyAfterCompletedTurn
PROPERTY SteerNeverRejectedWhileRunning
CHECK_DEADLOCK FALSE
